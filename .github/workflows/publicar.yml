name: Publicar no Instagram
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar itens no horário
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python publicar.py
      - name: Salvar registro de publicados
        run: |
          if [ -n "$(git status --porcelain publicados.json)" ]; then
            git config user.name "montiwood-robo"
            git config user.email "robo@montiwood.local"
            git add publicados.json
            git commit -m "Registro de publicação"
            git push
          fi
